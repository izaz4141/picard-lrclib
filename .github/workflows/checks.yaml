name: Checks

on:
  push:
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libegl1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install PyQt5

      - name: Clone picard
        run: |
          git clone --depth 1 https://github.com/metabrainz/picard.git picard-lib

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}/picard-lib:$PYTHONPATH" >> $GITHUB_ENV

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run ruff
        run: ruff check lrcget.py

      - name: Run mypy
        run: mypy --ignore-missing-imports lrcget.py
