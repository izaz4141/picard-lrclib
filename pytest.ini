[pytest]
testpaths = tests
# Repo root on sys.path so tests can import `src` and the local/vendored `picard`.
pythonpath = .
# Keep pytest from walking up into the repository root, which contains an
# `__init__.py` that pytest would otherwise collect as a Package and import
# (pulling in PyQt6 via the plugin's relative imports).
addopts = --confcutdir=tests
